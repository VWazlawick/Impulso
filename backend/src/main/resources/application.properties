spring.application.name=impulso

# Porta: o Render informa a dele na variável PORT; no computador fica a 8080
server.port=${PORT:8080}

# Bancos (Modelo 2): um banco central, com a lista de clientes e de logins, e um banco para cada
# cliente, todos no mesmo servidor PostgreSQL. O banco de um cliente novo se chama prefixo + código.
# No servidor, cada valor pode vir de uma variável de ambiente com o mesmo nome em maiúsculas
# (ex.: APP_BANCO_SERVIDOR, APP_BANCO_PARAMETROS=?sslmode=require, APP_BANCO_USUARIO).
#
# Ou uma URL só, no formato que o Neon e o Render fornecem (postgresql://usuario:senha@host/banco?sslmode=require):
# quando existe, vale no lugar de servidor, parâmetros, usuário e senha. Prefere a conexão direta (UNPOOLED).
app.banco.url=${DATABASE_URL_UNPOOLED:${DATABASE_URL:}}
app.banco.servidor=jdbc:postgresql://localhost:5432/
app.banco.parametros=
app.banco.usuario=postgres
app.banco.senha=${DB_PASSWORD:}
app.banco.central=impulso_central
app.banco.prefixo=impulso_
app.banco.conexoes-por-cliente=5

# Escola modelo: cada escola nova criada pelo comando --novo-cliente nasce com a ficha dela (grupos,
# subgrupos, perguntas e faixas; sem alunos nem avaliações). Vazio = ficha vazia. No comando, --modelo=código
# usa outra escola e --sem-modelo cria sem ficha. Se a modelo não existir no servidor, a ficha fica vazia.
app.clientes.modelo=escola-teste

# JPA / Hibernate: a estrutura dos bancos é do Flyway (db/central e db/migration). Como o banco só é
# conhecido a cada pedido, o Hibernate sobe sem conectar em nenhum e não confere nem cria tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false
# Sem a inicialização por scripts (schema.sql/data.sql) do Spring Boot: quem cria as tabelas é o Flyway
spring.sql.init.mode=never

# JWT (usado a partir da Tarefa 4)
app.jwt.secret=${JWT_SECRET}
# 8 horas: depois disso é preciso entrar de novo
app.jwt.expiration-ms=28800000

# Limite de login: depois de 5 senhas erradas seguidas, o e-mail fica travado por 15 minutos
app.login.max-tentativas=5
app.login.bloqueio-minutos=15

# Importação de país, estado e cidade a partir da API do IBGE (só roda com as tabelas vazias)
app.ibge.url=https://servicodados.ibge.gov.br/api/v1/localidades
app.ibge.importar=true

# Consulta de CEP (preenche rua, bairro e cidade do endereço)
app.viacep.url=https://viacep.com.br/ws
