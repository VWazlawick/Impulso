# Perfil de produção: ligue com a variável de ambiente SPRING_PROFILES_ACTIVE=prod.
# Vale tudo do application.properties, menos o que está aqui.

# Sem os comandos SQL no log
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Sem a documentação da API (Swagger) aberta na internet
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
