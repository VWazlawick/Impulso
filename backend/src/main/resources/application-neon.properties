# Perfil "neon": usa os bancos do Neon no lugar do PostgreSQL do computador.
# A conexão (DATABASE_URL e DATABASE_URL_UNPOOLED) vem do .env.local que o `neon link` gravou na pasta
# impulso, fora do Git. Ative com o perfil neon (no IntelliJ, campo Active profiles). O arquivo é
# procurado na pasta de onde o app roda e na pasta de cima: serve rodando de impulso ou de
# impulso/backend (o padrão do IntelliJ). No Render não precisa deste perfil: lá a DATABASE_URL é uma
# variável de ambiente.
spring.config.import=optional:file:.env.local[.properties],optional:file:../.env.local[.properties]

# Sem valor padrão de propósito: se o .env.local não for achado, o app para logo na subida com
# "Could not resolve placeholder 'DATABASE_URL'", em vez de usar sem avisar o PostgreSQL do computador.
app.banco.url=${DATABASE_URL_UNPOOLED:${DATABASE_URL}}
